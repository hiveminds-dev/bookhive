<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="icon-area" [class]="type">
        <svg *ngIf="type === 'danger'" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
        <svg *ngIf="type === 'warning'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>
        <svg *ngIf="type === 'primary'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>

      <div class="title-area">
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">{{ cancelText }}</button>
      <button type="button" class="btn-confirm" [class]="type" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
