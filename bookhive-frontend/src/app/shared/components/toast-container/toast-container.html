<div class="toast-wrapper" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let toast of toastService.toasts()"
    class="toast-item"
    [class]="'toast-' + toast.type"
  >
    <div class="icon-area">
      <svg *ngIf="toast.type === 'success'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg *ngIf="toast.type === 'error'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg *ngIf="toast.type === 'warning'" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
      <svg *ngIf="toast.type === 'info'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
    </div>

    <div class="content-area">
      <strong *ngIf="toast.title" class="toast-title">{{ toast.title }}</strong>
      <span class="toast-msg">{{ toast.message }}</span>
    </div>

    <button type="button" class="close-btn" (click)="toastService.remove(toast.id)" aria-label="Close alert">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
</div>
