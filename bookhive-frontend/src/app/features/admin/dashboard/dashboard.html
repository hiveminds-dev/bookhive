<div class="admin-master-container dashboard">
  <nav class="admin-breadcrumb">
    <a routerLink="/admin/dashboard">Admin</a>
    <span class="sep">/</span>
    <span class="current">Dashboard</span>
  </nav>

  <header class="admin-page-header">
    <div class="header-titles">
      <div class="title-row">
        <h1>{{ pageTitle() }}</h1>
        <span class="super-admin-badge" *ngIf="isSuperAdmin()">
          <svg lucideShieldCheck aria-hidden="true"></svg>
          Super Admin
        </span>
      </div>
      <p>{{ pageSubtitle() }}</p>
    </div>
  </header>

  <!-- SEARCH & ADVANCE SEARCH BAR -->
  <section class="admin-search-filter-section">
    <div class="search-primary-row">
      <div class="search-input-box">
        <svg lucideSearch class="search-icon" aria-hidden="true"></svg>
        <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" placeholder="Search across books, authors, readers, or system activity logs...">
        <button type="button" class="btn-clear-search" *ngIf="searchQuery()" (click)="clearSearch()">
          <svg lucideX aria-hidden="true"></svg>
        </button>
      </div>

      <button type="button" class="btn-advance-toggle" [class.active]="showAdvanceSearch()" (click)="toggleAdvanceSearch()">
        <svg lucideFilter aria-hidden="true"></svg>
        <span>Advance Search</span>
        <span class="filter-count-badge" *ngIf="filterTimeframe() !== 'all' || filterSortBy() !== 'newest'">!</span>
      </button>
    </div>

    <!-- Advance Search Expandable Panel -->
    <div class="advance-filter-panel" *ngIf="showAdvanceSearch()">
      <div class="filter-grid">
        <div class="filter-group">
          <label>Date Window</label>
          <select [ngModel]="filterTimeframe()" (ngModelChange)="filterTimeframe.set($event)">
            <option value="all">All Time</option>
            <option value="today">Today's Activity</option>
            <option value="7days">Past 7 Days</option>
            <option value="30days">Past 30 Days</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Sort By</label>
          <select [ngModel]="filterSortBy()" (ngModelChange)="filterSortBy.set($event)">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>

      <div class="filter-actions-row">
        <button type="button" class="btn-reset-filter" (click)="resetFilters()">Reset Filters</button>
        <button type="button" class="btn-apply-filter" (click)="applyFilters()">
          <svg lucideCheck aria-hidden="true"></svg>
          Apply Filters
        </button>
      </div>
    </div>
  </section>

  <app-statistics [isSuperAdmin]="isSuperAdmin()" />

  <div class="dashboard-grid">
    <div class="main-column">
      <app-recent-books [searchQuery]="searchQuery()" [filterTimeframe]="filterTimeframe()" />
      <div class="lower-grid">
        <app-recent-authors [searchQuery]="searchQuery()" [filterTimeframe]="filterTimeframe()" />
        <app-recent-requests [searchQuery]="searchQuery()" [filterTimeframe]="filterTimeframe()" />
      </div>
    </div>
    <app-activity [isSuperAdmin]="isSuperAdmin()" />
  </div>
</div>
