<section class="panel">
  <h2>Author Requests</h2>
  <div class="loading-row" *ngIf="loading()">Loading...</div>
  <div class="empty-row" *ngIf="!loading() && filteredRequests.length === 0">No matching requests found.</div>
  <a class="request" href="#" *ngFor="let request of filteredRequests">
    <span class="marker"></span>
    <span class="avatar">{{ getInitials(request.full_name) }}</span>
    <span class="details">
      <strong>{{ request.full_name }}</strong>
      <small>Pen: {{ request.pen_name }}{{ request.country ? ' · ' + request.country : '' }}</small>
    </span>
    <span class="badge">Pending</span>
    <span class="arrow">›</span>
  </a>
</section>
