<div class="admin-page admin-profile-page">
  <header class="profile-header-card">
    <div class="profile-avatar">
      <img src="images/auth/sign_in_1.png" alt="Profile image">
    </div>
    <div class="profile-meta">
      <span class="role-badge">{{ roleLabel() }}</span>
      <h1>{{ displayName() }}</h1>
      <p>{{ email }}</p>
    </div>
  </header>

  <div class="profile-content-grid">
    <!-- Account Information -->
    <section class="card-section">
      <h2>Account Overview</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="label">Username</span>
          <strong class="val">{{ user()?.username ?? 'admin' }}</strong>
        </div>
        <div class="info-item">
          <span class="label">Role</span>
          <strong class="val">{{ roleLabel() }}</strong>
        </div>
        <div class="info-item">
          <span class="label">Status</span>
          <span class="status-pill active">{{ status() }}</span>
        </div>
        <div class="info-item">
          <span class="label">Email Verification</span>
          <span class="status-pill verified">Verified</span>
        </div>
      </div>
    </section>

    <!-- Edit Profile Form -->
    <section class="card-section">
      <h2>Personal Details</h2>
      <form (ngSubmit)="saveProfile()">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" [(ngModel)]="fullName" name="fullName">
        </div>

        <div class="form-group margin-top">
          <label for="emailAddr">Email Address</label>
          <input id="emailAddr" type="email" [(ngModel)]="email" name="email">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </section>

    <!-- Security & Password -->
    <section class="card-section">
      <h2>Change Password</h2>
      <form (ngSubmit)="updatePassword()">
        <div class="form-group">
          <label for="currPass">Current Password</label>
          <input id="currPass" type="password" [(ngModel)]="currentPassword" name="currentPassword" placeholder="••••••••">
        </div>

        <div class="form-group margin-top">
          <label for="newPass">New Password</label>
          <input id="newPass" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••">
        </div>

        <div class="form-group margin-top">
          <label for="confPass">Confirm New Password</label>
          <input id="confPass" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-secondary">Update Password</button>
        </div>
      </form>
    </section>
  </div>
</div>
