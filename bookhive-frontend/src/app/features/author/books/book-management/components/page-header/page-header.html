<header class="page-header">

  <div class="breadcrumb">
    <span>Author</span>
    <span class="sep">/</span>
    <span class="current">{{ title }}</span>
  </div>

  <div class="header-row">

    <div class="header-copy">

      <h1>{{ title }}</h1>

      <p>{{ description }}</p>

    </div>

    <div class="header-actions">

      <button
        type="button"
        class="btn-primary"
        (click)="onUploadBook()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        Upload New Book
      </button>

      <nav
        class="management-tabs"
        aria-label="Book management navigation">

        <a
          routerLink="/author/books"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{
            exact: true
          }">
          My Books
        </a>

        <a
          routerLink="/author/books/upload"
          routerLinkActive="active">
          Upload Book
        </a>

        <a
          routerLink="/author/requests"
          routerLinkActive="active">
          Requests
        </a>

      </nav>

    </div>

  </div>

</header>
