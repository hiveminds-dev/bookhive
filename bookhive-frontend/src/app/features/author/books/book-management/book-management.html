<section class="book-management-page">

  <div class="management-container">

    <app-book-management-page-header
      title="My Books"
      sectionTitle="Book Library"
      description="View, edit, and organize all the books you've uploaded."
      (uploadBook)="goToUploadBook()">
    </app-book-management-page-header>

    <div class="filters-wrapper">

      <app-author-book-filters
        [statusCounts]="statusCounts"
        (statusChanged)="onStatusChanged($event)"
        (searchChanged)="onSearchChanged($event)">
      </app-author-book-filters>

    </div>

    <div class="books-wrapper">

      @if (isLoading) {
        <div class="state-panel" role="status" aria-live="polite">
          <strong>Loading your books...</strong>
          <span>Please wait while BookHive retrieves your author library.</span>
        </div>
      } @else if (loadError) {
        <div class="state-panel error-state" role="alert">
          <strong>Books could not be loaded</strong>
          <span>{{ loadError }}</span>
          <button type="button" (click)="loadBooks()">Try Again</button>
        </div>
      } @else {
        <app-author-book-grid
          [books]="paginatedBooks"
          [hasMatches]="filteredBooks.length > 0"
          [isSearching]="searchTerm.trim().length > 0 || selectedStatus !== 'All'"
          (viewBook)="viewBook($event)"
          (editBook)="editBook($event)"
          (deleteBook)="deleteBook($event)">
        </app-author-book-grid>
      }

    </div>

    @if (!isLoading && !loadError && totalPages > 1) {
      <div class="pagination-wrapper">

        <app-author-books-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          (pageChanged)="onPageChanged($event)">
        </app-author-books-pagination>

      </div>
    }

  </div>

</section>
