<section class="upload-grid">

  <!-- BOOK FILE -->

  <article class="upload-card">

    <h2>
      <span aria-hidden="true" style="display: inline-flex; vertical-align: middle;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </span>
      Book File (PDF)
      <strong>*</strong>
    </h2>

    <input
      #bookFileInput
      type="file"
      accept=".pdf,application/pdf"
      hidden
      (change)="onBookFileChange($event)">

    <button
      type="button"
      class="drop-zone"
      [class.drag-active]="isBookDragActive"
      [class.has-file]="selectedBookFile || initialBookFileName"
      (click)="bookFileInput.click()"
      (dragover)="onBookDragOver($event)"
      (dragleave)="onBookDragLeave($event)"
      (drop)="onBookDrop($event)">

      @if (selectedBookFile) {

        <span class="selected-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </span>

        <strong class="selected-name">
          {{ selectedBookFile.name }}
        </strong>

        <small>
          Click to replace the book file
        </small>

      } @else if (initialBookFileName) {

        <span class="selected-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </span>

        <strong class="selected-name">
          {{ initialBookFileName }}
        </strong>

        <small>
          Uploaded PDF on file. Click to upload a new version.
        </small>

      } @else {

        <span class="upload-cloud" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><polyline points="12 13 12 8 15 11"/><line x1="12" y1="8" x2="9" y2="11"/></svg>
        </span>

        <p>
          Drag &amp; drop or
          <strong>browse</strong>
        </p>

        <small>
          PDF file only (Max 100MB)
        </small>

      }

    </button>

    @if (selectedBookFile) {
      <button
        type="button"
        class="remove-button"
        (click)="removeBookFile()">
        Remove selected file
      </button>
    }

    @if (bookFileError) {
      <p class="error-message">
        {{ bookFileError }}
      </p>
    }

  </article>

  <!-- BOOK COVER -->

  <article class="upload-card">

    <h2>
      <span aria-hidden="true" style="display: inline-flex; vertical-align: middle;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </span>
      Book Cover
      <strong>*</strong>
    </h2>

    <input
      #coverInput
      type="file"
      accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
      hidden
      (change)="onCoverChange($event)">

    <button
      type="button"
      class="drop-zone cover-zone"
      [class.drag-active]="isCoverDragActive"
      [class.has-file]="selectedCover || coverPreview"
      (click)="coverInput.click()"
      (dragover)="onCoverDragOver($event)"
      (dragleave)="onCoverDragLeave($event)"
      (drop)="onCoverDrop($event)">

      @if (coverPreview) {

        <img
          class="cover-preview"
          [src]="coverPreview"
          alt="Selected book cover preview">

        <span class="replace-overlay">
          Click to replace cover
        </span>

      } @else {

        <span class="image-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </span>

        <p>
          Click or drag a cover image
        </p>

        <small>
          PNG, JPG, WebP (Max 10MB)
        </small>

      }

    </button>

    @if (selectedCover) {
      <button
        type="button"
        class="remove-button"
        (click)="removeCover()">
        Remove selected cover
      </button>
    }

    @if (coverError) {
      <p class="error-message">
        {{ coverError }}
      </p>
    }

  </article>

</section>
