<div class="save-actions">

  <button
    type="button"
    class="draft-button"
    [disabled]="
      isSavingDraft ||
      isSubmitting
    "
    (click)="onSaveDraft()">

    @if (isSavingDraft) {
      <span
        class="button-spinner"
        aria-hidden="true">
      </span>

      <span>Saving...</span>
    } @else {
      <span>Save Draft</span>
    }

  </button>

  <button
    type="button"
    class="submit-button"
    [disabled]="
      submitDisabled ||
      isSavingDraft ||
      isSubmitting
    "
    (click)="onSubmitForReview()">

    @if (isSubmitting) {
      <span
        class="button-spinner light"
        aria-hidden="true">
      </span>

      <span>Submitting...</span>
    } @else {
      <span
        class="rocket-icon"
        aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </span>

      <span>Submit for review</span>
    }

  </button>

</div>
