<div class="save-actions">

  <button
    type="button"
    class="draft-button"
    [disabled]="
      isSavingDraft ||
      isSubmitting
    "
    (click)="onSaveDraft()">

    @if (isSavingDraft) {
      <span
        class="button-spinner"
        aria-hidden="true">
      </span>

      <span>Saving...</span>
    } @else {
      <span>Save Draft</span>
    }

  </button>

  <button
    type="button"
    class="submit-button"
    [disabled]="
      submitDisabled ||
      isSavingDraft ||
      isSubmitting
    "
    (click)="onSubmitForReview()">

    @if (isSubmitting) {
      <span
        class="button-spinner light"
        aria-hidden="true">
      </span>

      <span>Submitting...</span>
    } @else {
      <span
        class="rocket-icon"
        aria-hidden="true">
        ◇
      </span>

      <span>Submit for review</span>
    }

  </button>

</div>
