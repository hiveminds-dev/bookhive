<main class="profile-page">

  <nav
    class="profile-breadcrumb"
    aria-label="Breadcrumb"
  >
    <span>Author</span>
    <span class="separator">/</span>
    <span class="current">Profile</span>
  </nav>

  <section class="profile-introduction">

    <app-profile-header
      [authorName]="authorName()"
      [penName]="penName()"
      [profileImage]="profileImage"
      [badges]="badges()"
      (profileImageChanged)="
        onProfileImageChanged($event)
      "
    />

    <app-profile-actions
      (editProfileSelected)="
        editProfile()
      "
      (changePasswordSelected)="
        changePassword()
      "
    />

  </section>


  <app-profile-statistics
    [statistics]="profileStatistics"
  />

  <app-profile-information />

  <app-profile-books
    [books]="books"
    (bookSelected)="openBook($event)"
    (viewAllSelected)="viewAllBooks()"
  />

</main>
