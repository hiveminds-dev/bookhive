<section class="details-section">

  <div class="section-heading">
    <h2>Personal Details</h2>

    <p>
      Update your personal and author
      information.
    </p>
  </div>

  <form
    class="details-form"
    [formGroup]="detailsForm"
  >

    <div class="form-group">
      <label for="full-name">
        Full Name
        <span>*</span>
      </label>

      <input
        id="full-name"
        type="text"
        formControlName="fullName"
        placeholder="Enter your full name"
        [class.invalid]="
          isInvalid('fullName')
        "
      >

      @if (isInvalid('fullName')) {
        <small class="error-message">
          Enter at least 3 characters.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="pen-name">
        Pen Name
        <span>*</span>
      </label>

      <input
        id="pen-name"
        type="text"
        formControlName="penName"
        placeholder="Enter your pen name"
        [class.invalid]="
          isInvalid('penName')
        "
      >

      @if (isInvalid('penName')) {
        <small class="error-message">
          Enter a valid pen name.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="email">
        Email Address
        <span>*</span>
      </label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter your email"
        [class.invalid]="
          isInvalid('email')
        "
      >

      @if (isInvalid('email')) {
        <small class="error-message">
          Enter a valid email address.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="phone">
        Phone Number
        <span>*</span>
      </label>

      <input
        id="phone"
        type="tel"
        formControlName="phone"
        placeholder="Enter phone number"
        [class.invalid]="
          isInvalid('phone')
        "
      >

      @if (isInvalid('phone')) {
        <small class="error-message">
          Enter a valid phone number.
        </small>
      }
    </div>

    <div class="form-group">
      <label for="country">
        Country
        <span>*</span>
      </label>

      <select
        id="country"
        formControlName="country"
      >
        @for (
          country of countries;
          track country
          ) {
          <option [value]="country">
            {{ country }}
          </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="language">
        Language
        <span>*</span>
      </label>

      <select
        id="language"
        formControlName="language"
      >
        @for (
          language of languages;
          track language
          ) {
          <option [value]="language">
            {{ language }}
          </option>
        }
      </select>
    </div>

    <div class="form-group full-width">
      <label for="category">
        Author Category
        <span>*</span>
      </label>

      <select
        id="category"
        formControlName="category"
      >
        @for (
          category of categories;
          track category
          ) {
          <option [value]="category">
            {{ category }}
          </option>
        }
      </select>
    </div>

  </form>

</section>
