<div class="save-actions">

  <button
    type="button"
    class="cancel-button"
    [disabled]="isSaving"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    type="button"
    class="save-button"
    [disabled]="
      isSaving ||
      isSaveDisabled
    "
    (click)="save()"
  >
    @if (isSaving) {
      <span
        class="spinner"
        aria-hidden="true"
      ></span>

      Saving...
    } @else {
      <span aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </span>

      Save Changes
    }
  </button>

</div>
