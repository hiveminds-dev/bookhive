<div
  class="profile-actions"
  aria-label="Profile actions"
>
  <button
    type="button"
    class="action-button primary"
    (click)="editProfile()"
  >
    Edit Profile
  </button>

  <button
    type="button"
    class="action-button secondary"
    (click)="changePassword()"
  >
    Change Password
  </button>
</div>
