<section class="profile-header">

  <div class="profile-photo-wrapper">

    <img
      class="profile-photo"
      [src]="profileImage"
      [alt]="authorName + ' profile photo'"
      (error)="handleImageError($event)"
    >

    <label
      class="camera-button"
      for="profile-image-input"
      aria-label="Change profile photo"
    >
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </span>
    </label>

    <input
      id="profile-image-input"
      class="file-input"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      (change)="onImageSelected($event)"
    >

  </div>

  <div class="author-details">

    <h1>
      {{ authorName }}
    </h1>

    <p class="pen-name">
      {{ penName }}
    </p>

    <div class="badges">
      @for (
        badge of badges;
        track badge
        ) {
        <span class="badge">
          {{ badge }}
        </span>
      }
    </div>

  </div>

</section>
