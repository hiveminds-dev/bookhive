<section class="request-table">

  <div class="table-header">
    <span>Book Cover</span>
    <span>Book Title</span>
    <span>Submission Date</span>
    <span>Status</span>
    <span>Admin Feedback</span>
    <span>Actions</span>
  </div>

  <div class="table-body">
    @for (
      request of requests;
      track request.id
      ) {
      <app-author-request-row
        [request]="request"
        (actionSelected)="onRequestAction($event)"
      />
    } @empty {
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M6 6h10M6 10h7"/></svg>
        </div>

        <h3>No book requests found</h3>

        <p>
          No submissions match the selected filter.
        </p>
      </div>
    }
  </div>

  @if (requests.length > 0) {
    <div class="pagination">

      <button
        type="button"
        class="page-arrow"
        aria-label="Previous page"
        [disabled]="currentPage === 1"
        (click)="previousPage()"
      >
        ‹
      </button>

      <div class="page-numbers">
        @for (page of visiblePages; track page) {
          <button
            type="button"
            class="page-button"
            [class.active]="page === currentPage"
            [attr.aria-current]="
              page === currentPage
                ? 'page'
                : null
            "
            (click)="changePage(page)"
          >
            {{ page }}
          </button>
        }
      </div>

      <button
        type="button"
        class="page-arrow"
        aria-label="Next page"
        [disabled]="currentPage === totalPages"
        (click)="nextPage()"
      >
        ›
      </button>

    </div>
  }

</section>
