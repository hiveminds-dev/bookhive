<header class="request-header">

  <div class="breadcrumb">
    <span>Author</span>
    <span class="sep">/</span>
    <span class="current">Requests</span>
  </div>

  <div class="header-row">

    <div class="header-copy">

      <h1>Book Requests</h1>

      <p>
        Review submission status, admin feedback, and books waiting for approval.
      </p>

    </div>

    <nav
      class="management-tabs"
      aria-label="Book management navigation">

      <a
        routerLink="/author/books"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }">
        My Books
      </a>

      <a
        routerLink="/author/books/upload"
        routerLinkActive="active">
        Upload Book
      </a>

      <a
        routerLink="/author/requests"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }">
        Requests
      </a>

    </nav>

  </div>

</header>
