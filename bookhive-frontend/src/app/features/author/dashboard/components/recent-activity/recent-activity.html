<section class="activity-card">

  <header>
    <h2>Recent Activity Timeline</h2>
  </header>

  <div class="activity-list">

    @for (
      activity of activities;
      track activity.id;
      let last = $last
      ) {

      <article class="activity-item">

        <div class="timeline-column">

          <span
            class="timeline-point"
            [class]="getActivityClass(activity.type)">
          </span>

          @if (!last) {
            <span class="timeline-line"></span>
          }

        </div>

        <div class="activity-content">

          <div class="activity-text">
            <h3>{{ activity.title }}</h3>
            <p>{{ activity.description }}</p>
          </div>

          <time>{{ activity.time }}</time>

        </div>

      </article>

    } @empty {

      <div class="empty-state">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#94a3b8" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <p>No recent activity is available.</p>
      </div>

    }

  </div>

</section>
