<section class="recent-books-card">

  <header class="card-header">

    <h2>Recent Uploads</h2>

    <button
      type="button"
      (click)="onViewAll()">
      View All
    </button>

  </header>

  <div class="header-line" aria-hidden="true"></div>

  <div class="book-list">

    @for (book of books; track book.id) {

      <article class="book-item">

        <button
          type="button"
          class="book-main"
          (click)="selectBook(book)">

          <div class="cover-wrapper">

            @if (!imageHasFailed(book.id)) {
              <img
                [src]="book.cover"
                [alt]="book.title + ' cover'"
                (error)="onImageError(book.id)">
            } @else {
              <span class="cover-placeholder">
                📖
              </span>
            }

          </div>

          <div class="book-details">

            <h3>{{ book.title }}</h3>

            <p>
              Uploaded: {{ book.uploadedDate }}
            </p>

            <span
              class="status"
              [class]="getStatusClass(book.status)">
              {{ book.status }}
            </span>

          </div>

        </button>

        <button
          type="button"
          class="more-button"
          aria-label="More options"
          title="More options">
          ⋮
        </button>

      </article>

    } @empty {

      <div class="empty-state">
        <span>📚</span>
        <p>No books have been uploaded yet.</p>
      </div>

    }

  </div>

</section>
