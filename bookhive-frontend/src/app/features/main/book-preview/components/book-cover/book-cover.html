<div class="cover-container">

  @if (badge) {
    <span class="cover-badge">
      {{ badge }}
    </span>
  }

  @if (!imageLoadFailed && cover) {
    <img
      class="book-cover"
      [src]="cover"
      [alt]="title + ' book cover'"
      (error)="onImageError()">
  } @else {
    <div class="cover-placeholder">
      <span class="book-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
      <p>{{ title || 'Book cover' }}</p>
    </div>
  }

</div>
