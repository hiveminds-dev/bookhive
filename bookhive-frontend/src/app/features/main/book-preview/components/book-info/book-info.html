<div class="book-information">

  <div class="info-item rating-item">
    <span class="info-icon star-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>

    <div class="info-text">
      <strong>{{ rating.toFixed(1) }}</strong>
      <span>({{ reviews }} reviews)</span>
    </div>
  </div>

  <span class="divider" aria-hidden="true"></span>

  <div class="info-item">
    <span class="info-icon pages-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>

    <div class="info-text">
      <strong>{{ pages && pages > 0 ? pages : 'Not available' }}</strong>
      <span>Pages</span>
    </div>
  </div>

  @if (readingTime && readingTime !== 'N/A') {
    <span class="divider" aria-hidden="true"></span>

    <div class="info-item">
      <span class="info-icon clock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>

      <div class="info-text">
        <strong>{{ readingTime }}</strong>
        <span>Reading time</span>
      </div>
    </div>
  }

</div>
