<div class="book-actions">

  <button
    type="button"
    class="read-button"
    (click)="onReadBook()">

    <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
    <span>Read Book Now</span>
  </button>

  <button
    type="button"
    class="download-button"
    [disabled]="!canDownload"
    (click)="onDownloadBook()">

    <span class="download-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></span>
    <span>Download</span>
  </button>

</div>
