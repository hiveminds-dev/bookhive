<div class="reader-toolbar">

  <div class="toolbar-group zoom-controls">

    <button
      type="button"
      aria-label="Zoom out"
      title="Zoom out"
      [disabled]="zoomLevel <= 50"
      (click)="onZoomOut()">
      <span class="search-symbol" aria-hidden="true"></span>
      <span class="zoom-mark">−</span>
    </button>

    <span class="zoom-value">
      {{ zoomLevel }}%
    </span>

    <button
      type="button"
      aria-label="Zoom in"
      title="Zoom in"
      [disabled]="zoomLevel >= 150"
      (click)="onZoomIn()">
      <span class="search-symbol" aria-hidden="true"></span>
      <span class="zoom-mark">+</span>
    </button>

  </div>

  <div class="toolbar-group page-controls">

    <button
      type="button"
      aria-label="Previous page"
      title="Previous page"
      [disabled]="currentPage <= 1"
      (click)="onPreviousPage()">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <span class="page-count">
      Page {{ currentPage }} of {{ totalPages }}
    </span>

    <button
      type="button"
      aria-label="Next page"
      title="Next page"
      [disabled]="currentPage >= totalPages"
      (click)="onNextPage()">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>

  </div>

  <div class="toolbar-group action-controls">

    <button
      type="button"
      aria-label="Bookmark page"
      title="Bookmark"
      [class.active]="bookmarked"
      (click)="toggleBookmark()">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" [attr.fill]="bookmarked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
    </button>

    <button
      type="button"
      aria-label="Download book"
      title="Download"
      (click)="onDownload()">
      <svg class="download-symbol" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>

    <button
      type="button"
      aria-label="Open fullscreen"
      title="Fullscreen"
      (click)="onFullscreen()">
      <svg class="fullscreen-symbol" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>

  </div>

</div>
