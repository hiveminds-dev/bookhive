<aside class="reader-settings">

  <section class="quick-actions">

    <h2>Quick Actions</h2>

    <button
      type="button"
      class="action-button"
      (click)="onShareExcerpt()">

      <span class="action-icon share-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4h14v-4"/></svg>
      </span>

      <span>
        Share
        <small>Excerpt</small>
      </span>
    </button>

    <span class="action-divider" aria-hidden="true"></span>

    <button
      type="button"
      class="action-button report-button"
      (click)="onReportIssue()">

      <span class="action-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v4h1"/></svg>
      </span>

      <span>
        Report
        <small>Issue</small>
      </span>
    </button>

  </section>

  <section class="page-number-card">

    <label for="reader-page-number">
      Page Number
    </label>

    <input
      id="reader-page-number"
      type="number"
      min="1"
      [max]="totalPages"
      [(ngModel)]="pageInput"
      (keyup.enter)="goToPage()"
      (blur)="goToPage()">

    <small>
      of {{ totalPages }}
    </small>

  </section>

</aside>
