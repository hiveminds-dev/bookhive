<aside class="reader-sidebar">

  <section class="book-summary">

    <div class="cover-wrapper">

      @if (!imageLoadFailed && cover) {
        <img
          [src]="cover"
          [alt]="bookTitle + ' book cover'"
          (error)="onImageError()">
      } @else {
        <div class="cover-placeholder">
          <span aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
          <p>{{ bookTitle }}</p>
        </div>
      }

    </div>

    <div class="book-statistics">

      <div class="stat">
        <span>Pages</span>
        <strong>{{ totalPages }}</strong>
      </div>

      <span
        class="stat-divider"
        aria-hidden="true">
      </span>

      <div class="stat">
        <span>Rating</span>
        <strong>{{ rating.toFixed(1) }}/5</strong>
      </div>

    </div>

  </section>

</aside>
