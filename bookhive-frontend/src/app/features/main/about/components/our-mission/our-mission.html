<section class="mission-section">

  <h2>Our Mission</h2>

  <div class="mission-grid">

    @for (
      item of missionItems;
      track item.id
      ) {
      <article class="mission-card">

        <span
          class="mission-icon"
          aria-hidden="true"
        >
          @if (item.icon === 'read') {
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>
          } @else if (item.icon === 'publish') {
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          }
        </span>

        <h3>
          {{ item.title }}
        </h3>

        <p>
          {{ item.description }}
        </p>

      </article>
    }

  </div>

</section>
