<section class="community-cta">

  <div class="cta-content">

    <h2>
      Join Thousands of Passionate Readers
    </h2>

    <p>
      Become part of Sri Lanka's growing reading
      community and embark on a journey of continuous
      learning and discovery.
    </p>

    <div class="cta-actions">

      <button
        type="button"
        class="join-button"
        (click)="onJoinCommunity()"
      >
        Join Community
      </button>

      <button
        type="button"
        class="explore-button"
        (click)="onExploreBooks()"
      >
        Explore Books
      </button>

    </div>

  </div>

</section>
