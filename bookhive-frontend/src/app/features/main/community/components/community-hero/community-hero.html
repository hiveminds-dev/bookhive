<section class="community-hero">

  <div class="hero-content">

    <h1>
      <span>BookHive</span>
      Community
    </h1>

    <p>
      Connect with readers, discuss books, share ideas,
      and discover new recommendations in Sri Lanka's
      largest literary circle.
    </p>

    <div class="hero-actions">

      <button
        type="button"
        class="primary-button"
        (click)="onStartDiscussion()"
      >
        Start Discussion
      </button>

      <button
        type="button"
        class="secondary-button"
        (click)="onBrowseCommunities()"
      >
        Browse Communities
      </button>

    </div>

  </div>

</section>
