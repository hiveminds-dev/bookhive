<section class="search-section">

  <div class="search-box">

    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    <input
      #searchInput
      type="search"
      [value]="searchTerm"
      placeholder="Search discussions, books, authors..."
      aria-label="Search community discussions"
      (input)="onSearch($event)"
    />

    @if (searchTerm) {
      <button
        type="button"
        class="clear-button"
        aria-label="Clear search"
        (click)="clearSearch(); searchInput.value = ''"
      >
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    }

  </div>

</section>
