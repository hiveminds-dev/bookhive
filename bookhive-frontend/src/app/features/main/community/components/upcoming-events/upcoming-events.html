<section class="events-section">

  <h2>
    Upcoming Book Club Events
  </h2>

  <div class="events-grid">

    @for (
      event of events;
      track event.id
      ) {
      <article class="event-card">

        <div class="event-image">

          <img
            [src]="event.image"
            [alt]="event.title"
          />

          <span class="event-date">
            {{ event.date }}
          </span>

        </div>

        <div class="event-content">

          <h3>
            {{ event.title }}
          </h3>

          <p class="event-host">
            Hosted by:
            <strong>
              {{ event.host }}
            </strong>
          </p>

          <div class="event-details">

            <span>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>

              {{ event.time }}
            </span>

            <span>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>

              {{ event.location }}
            </span>

          </div>

          <button
            type="button"
            [class.featured]="event.featured"
            (click)="selectEvent(event)"
          >
            {{ event.buttonText }}
          </button>

        </div>

      </article>
    }

  </div>

</section>
