<main class="community-page">

  <app-community-hero
    (startDiscussion)="onStartDiscussion()"
    (browseCommunities)="onBrowseCommunities()"
  />

  <app-community-search
    (searchChanged)="onSearchChanged($event)"
  />

  <div class="community-container">

    <section class="popular-area">

      <app-popular-communities
        (communityJoined)="onCommunityJoined($event)"
        (viewAll)="onViewAllCommunities()"
      />

    </section>

    <div class="community-content-grid">

      <div class="main-column">

        <app-trending-discussions
          [searchTerm]="searchTerm"
          (threadSelected)="onThreadSelected($event)"
          (discussionLiked)="onDiscussionLiked($event)"
        />

        <app-upcoming-events
          (eventSelected)="onEventSelected($event)"
        />

        <app-active-members
          (followChanged)="onFollowChanged($event)"
        />

      </div>

      <div class="sidebar-column">

        <app-community-sidebar
          (communitySelected)="
            onSuggestedCommunitySelected($event)
          "
          (policySelected)="onPolicySelected()"
        />

      </div>

    </div>

    <section class="cta-area">

      <app-community-cta
        (joinCommunity)="onJoinCommunity()"
        (exploreBooks)="onExploreBooks()"
      />

    </section>

  </div>

  @if (notificationMessage) {
    <div
      class="community-notification"
      role="status"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>

      <p>
        {{ notificationMessage }}
      </p>

      <button
        type="button"
        aria-label="Close notification"
        (click)="closeNotification()"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  }

</main>
