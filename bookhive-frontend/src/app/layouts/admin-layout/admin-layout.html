<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/admin/dashboard">
      <img src="assets/bookhive-logo.png" alt="BookHive logo">
      <span>BookHive</span>
    </a>

    <div class="admin-profile">
      <img src="assets/images/auth/sign_in_1.png" alt="Administrator profile">
      <div>
        <strong>{{ displayName() }}</strong>
        <span [class.role-super-admin]="isSuperAdmin()">{{ roleLabel() }}</span>
      </div>
    </div>

    <nav class="side-nav" aria-label="Admin navigation">
      <a routerLink="/admin/dashboard" routerLinkActive="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Dashboard</a>
      <a routerLink="/admin/books" routerLinkActive="active"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg> Books</a>
      <a routerLink="/admin/categories" routerLinkActive="active"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Categories</a>
      <a routerLink="/admin/authors" routerLinkActive="active"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><circle cx="8" cy="7" r="3"/></svg> Authors</a>
      <a routerLink="/admin/community" routerLinkActive="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M12 8v4M9 14 6.5 16M15 14l2.5 2"/></svg> Community</a>
      <a routerLink="/admin/statistics" routerLinkActive="active"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg> Statistics</a>

      <!-- Super Admin only: Admin Governance -->
      <a *ngIf="isSuperAdmin()" routerLink="/admin/admins" routerLinkActive="active" class="super-link">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Admin Governance
        <span class="super-badge">SA</span>
      </a>

      <a routerLink="/admin/profile" routerLinkActive="active"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg> Profile</a>
      <a routerLink="/admin/support" routerLinkActive="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4M12 18h.01"/></svg> Support</a>
      <button class="logout" type="button" (click)="promptLogout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Logout</button>
    </nav>

    <div class="sidebar-action">
      <a routerLink="/admin/books/upload" class="btn-publish"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg> Publish New Work</a>
    </div>
  </aside>

  <app-toast-container />

  <app-confirmation-modal
    *ngIf="showLogoutConfirmSignal()"
    title="Sign Out of BookHive?"
    message="Are you sure you want to end your administrator session?"
    confirmText="Sign Out"
    type="warning"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()"
  />

  <section class="workspace">
    <header class="topbar">
      <label class="global-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" placeholder="Search authors, books, or records..." aria-label="Global search">
      </label>

      <div class="topbar-actions">
        <a href="#">Guidelines</a>
        <a href="#">Review Board</a>
        <span class="separator"></span>
        <button type="button" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button type="button" aria-label="Applications"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg></button>
        <img src="assets/images/auth/sign_in_1.png" alt="Admin">
      </div>
    </header>

    <main class="content"><router-outlet /></main>

    <footer class="admin-footer">
      <div><strong>BookHive</strong><span>© 2026 BookHive. All rights reserved.</span></div>
      <nav><a href="#">Privacy Policy</a><a href="#">Terms of Service</a><a href="#">Intellectual Property</a><a href="#">Contact Support</a></nav>
    </footer>
  </section>
</div>
