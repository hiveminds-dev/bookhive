name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "bookhive-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "bookhive-backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  check-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bookhive-backend

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: bookhive-backend/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check code quality
        run: ruff check .

      - name: Run tests
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' | grep -q .; then
            pytest
          else
            echo "No backend tests have been added yet."
          fi
